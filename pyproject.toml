[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "endstone-vein-miner"
version = "2.0.3+server.4"
description = "Chinese VeinMiner with safe per-player controls, Territory protection and Tianyan audit"
readme = "README.md"
requires-python = ">=3.12,<3.16"
license = {file = "LICENSE"}
authors = [{name = "Euphoria Development Organization"}, {name = "ReallocAll"}]
dependencies = ["endstone>=0.11,<0.12"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.15,<1", "build>=1.3,<2"]

[project.urls]
Repository = "https://github.com/ReallocAll/VeinMiner-Endstone"

[project.entry-points."endstone"]
vein-miner = "endstone_vein_miner.plugin:VeinMinerPlugin"

[tool.hatch.build.targets.wheel]
packages = ["src/endstone_vein_miner"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
