name: BDS runtime smoke

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bds:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Endstone and build tools
        run: python -m pip install "endstone>=0.11,<0.12" "build>=1.3,<2" psutil
      - name: Build plugin wheel
        run: python -m build --wheel
      - name: Bootstrap real Bedrock Dedicated Server and check commands
        run: |
          python - <<'PY'
          import glob
          import os
          import shutil
          import signal
          import subprocess
          import sys
          import threading
          import time
          from pathlib import Path

          root = Path.cwd()
          server_dir = root / "bds-smoke"
          plugins = server_dir / "plugins"
          plugins.mkdir(parents=True)
          wheel, = glob.glob("dist/*.whl")
          shutil.copyfile(wheel, plugins / Path(wheel).name)
          log_path = root / "bds-smoke.log"
          lines = []

          proc = subprocess.Popen(
              [sys.executable, "-m", "endstone", "--yes", "--server-folder", str(server_dir)],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
              text=True,
              errors="replace",
              bufsize=1,
              start_new_session=True,
          )

          def collect():
              with log_path.open("w", encoding="utf-8") as log:
                  for line in proc.stdout:
                      lines.append(line)
                      log.write(line)
                      log.flush()
                      print(line, end="", flush=True)

          reader = threading.Thread(target=collect, daemon=True)
          reader.start()

          def wait_for(predicate, timeout, label):
              end = time.monotonic() + timeout
              while time.monotonic() < end:
                  if predicate(lines):
                      return
                  if proc.poll() is not None:
                      raise RuntimeError(f"BDS exited before {label}: {proc.returncode}")
                  time.sleep(0.25)
              raise TimeoutError(f"Timed out waiting for {label}")

          try:
              wait_for(
                  lambda current: any("server started" in line.lower() for line in current),
                  240,
                  "BDS ready",
              )
              wait_for(
                  lambda current: any(
                      "vein" in line.lower()
                      and ("enabl" in line.lower() or "load" in line.lower())
                      for line in current
                  ),
                  40,
                  "VeinMiner enabled",
              )
              if any("failed to load" in line.lower() and "vein" in line.lower() for line in lines):
                  raise AssertionError("VeinMiner failed to load")
              checkpoint = len(lines)
              proc.stdin.write("vm reload\n")
              proc.stdin.flush()
              wait_for(
                  lambda current: any("玩家设置已重新加载" in line for line in current[checkpoint:]),
                  15,
                  "vm reload command response",
              )
              proc.stdin.write("stop\n")
              proc.stdin.flush()
              if proc.wait(timeout=60) != 0:
                  raise RuntimeError(f"BDS exited abnormally: {proc.returncode}")
              print("Real BDS plugin lifecycle smoke: PASS")
          finally:
              if proc.poll() is None:
                  try:
                      os.killpg(proc.pid, signal.SIGTERM)
                      proc.wait(timeout=12)
                  except (ProcessLookupError, subprocess.TimeoutExpired):
                      os.killpg(proc.pid, signal.SIGKILL)
              reader.join(timeout=5)
          PY
      - name: Upload BDS startup log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veinminer-bds-startup
          path: bds-smoke.log
          if-no-files-found: warn
          retention-days: 14
