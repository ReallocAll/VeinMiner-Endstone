name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install build and test tools
        run: python -m pip install "pytest>=8,<10" "ruff>=0.15,<1" "build>=1.3,<2"
      - name: Lint
        run: ruff check src tests
      - name: Test
        run: PYTHONPATH=src pytest -q
      - name: Build wheel
        run: python -m build --wheel
      - name: Verify wheel metadata and entry point
        run: |
          python - <<'PY'
          import glob
          import zipfile
          from email.parser import Parser
          path, = glob.glob("dist/*.whl")
          with zipfile.ZipFile(path) as wheel:
              names = wheel.namelist()
              entry, = (p for p in names if p.endswith(".dist-info/entry_points.txt"))
              metadata, = (p for p in names if p.endswith(".dist-info/METADATA"))
              assert "vein-miner = endstone_vein_miner.plugin:VeinMinerPlugin" in wheel.read(entry).decode()
              parsed = Parser().parsestr(wheel.read(metadata).decode())
              assert set(parsed["Requires-Python"].replace(" ", "").split(",")) == {">=3.12", "<3.16"}
              assert "endstone_vein_miner/plugin.py" in names
          print("Wheel metadata verified:", path)
          PY
      - name: Resolve runtime dependencies
        run: python -m pip install --dry-run dist/*.whl
      - name: Install wheel without runtime dependencies
        run: python -m pip install --no-deps dist/*.whl

      - name: Smoke-test actual Endstone Python bindings
        run: |
          python -m pip install --no-deps "endstone>=0.11,<0.12" "lazy-loader>=0.4" "tomlkit>=0.13" "importlib-resources>=6"
          python - <<'PY'
          from endstone import Player
          from endstone.block import Block
          from endstone.form import ActionForm
          from endstone.level import Dimension
          from endstone.plugin import Plugin
          from endstone_vein_miner.plugin import VeinMinerPlugin

          assert issubclass(VeinMinerPlugin, Plugin)
          assert VeinMinerPlugin.commands["vm"]["aliases"] == ["veinminer"]
          assert hasattr(Player, "send_form")
          assert hasattr(Player, "send_tip")
          assert hasattr(Player, "perform_command")
          assert hasattr(Player, "is_valid")
          assert hasattr(Plugin, "data_folder")
          assert hasattr(Dimension, "get_block_at")
          assert hasattr(Block, "type")
          assert hasattr(Block, "dimension")
          form = ActionForm(title="连锁挖掘", content="静态绑定验证")
          form.add_button("开关")
          form.on_submit = lambda player, index: None
          assert len(form.controls) == 1
          print("Endstone binding smoke test passed")
          PY
